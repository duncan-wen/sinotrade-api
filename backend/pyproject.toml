[project]
name = "sinotrade-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "shioaji[speed]",
    "python-dotenv",
    "cachetools",
    "pandas",
    "mypy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "pytest-httpserver",
    "ruff",
    "black",
    "mypy",
    "pre-commit",
    "ipykernel>=6.30.1",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "RUF", # ruff-specific rules
    "FA", # flake8-future-annotations
    "T10", # flake8-debugger
    "T20", # flake8-print
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.black]
line-length = 88
target-version = ['py313']
