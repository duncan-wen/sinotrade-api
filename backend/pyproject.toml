[project]
name = "sinotrade-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "shioaji[speed]",
    "python-dotenv",
    "cachetools",
    "pandas",
    "loguru",
    "mypy>=1.17.1",
    "polars>=1.33.1",
    "polars-talib>=0.1.5",
    "fastapi-socketio>=0.0.10",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "pytest-httpserver",
    "ruff",
    "mypy",
    "pre-commit",
    "ipykernel>=6.30.1",
    "types-cachetools>=6.2.0.20250827",
    "pandas-stubs>=2.3.2.250827",
    "isort>=6.0.1",
    "types-requests>=2.32.4.20250913",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
    "FA",  # flake8-future-annotations
    "T10", # flake8-debugger
    "T20", # flake8-print
]
ignore = [
    "E501", # line too long, handled by ruff formatter
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"fix_encoding.py" = ["T201"] # Allow print statements in utility scripts

[tool.ruff.format]
# 格式化配置 - 兼容 Black 風格
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true
