[project]
name = "sinotrade-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "shioaji[speed]",
    "python-dotenv",
    "cachetools",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "pytest-httpserver", "ruff", "black"]

[tool.uv]
package = false

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88

[dependency-groups]
dev = ["ipykernel>=6.30.1"]
